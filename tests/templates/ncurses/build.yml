build_profiles: [nocheck, noudeb, nobiarch]
build_options: [nocheck]
build_depends: [glibc:libc6-dev]
runtime_depends:
  libncurses6: [ncurses:libtinfo6]
  libncursesw6: [ncurses:libtinfo6]
  libncurses-dev: [ncurses:libtinfo6, ncurses:libncurses6, ncurses:libncursesw6]
lockfile_deps:
  libtinfo6: [libgcc-s1]
  libncurses6: [libgcc-s1]
  libncursesw6: [libgcc-s1]
  libncurses-dev: [libgcc-s1, linux-libc-dev, rpcsvc-proto]
