build_profiles: [nocheck, noudeb, stage1, noinsttest, nodoc]
build_options: [nocheck]
build_depends: [glibc:libc6-dev]
runtime_depends:
  libsystemd0: [libcap2:libcap2, libselinux:libselinux1, libzstd:libzstd1, gcc-16:libgcc-s1]
  systemd: [libcap2:libcap2, libselinux:libselinux1, acl:libacl1, libzstd:libzstd1, gcc-16:libgcc-s1]
  libsystemd-dev: [systemd:libsystemd0, gcc-16:libgcc-s1]
lockfile_deps:
  libsystemd-dev: [linux-libc-dev, rpcsvc-proto]
