build_profiles: [nocheck, noudeb]
build_options: [nocheck]
build_depends: [glibc:libc6-dev]
runtime_depends:
  libssl3t64: [openssl:openssl-provider-legacy, zlib:zlib1g, libzstd:libzstd1, gcc-16:libgcc-s1]
  openssl-provider-legacy: [openssl:libssl3t64, gcc-16:libgcc-s1]
  libssl-dev: [openssl:libssl3t64, gcc-16:libgcc-s1]
  openssl: [gcc-16:libgcc-s1]
lockfile_deps:
  libssl-dev: [linux-libc-dev, rpcsvc-proto]
