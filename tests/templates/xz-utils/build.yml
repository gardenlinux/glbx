build_profiles: [nocheck, noudeb]
build_options: [nocheck]
build_depends: [glibc:libc6-dev]
runtime_depends:
  liblzma-dev: [xz-utils:liblzma5, xz-utils:xz-utils, gcc-16:libgcc-s1]
  xz-utils: [xz-utils:liblzma5, gcc-16:libgcc-s1]
  liblzma5: [gcc-16:libgcc-s1]
lockfile_deps:
  liblzma-dev: [linux-libc-dev, rpcsvc-proto]
