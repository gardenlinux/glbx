build_profiles: [nocheck, noudeb]
build_options: [nocheck]
build_depends: [glibc:libc6-dev]
runtime_depends:
  libgmpxx4ldbl: [gmp:libgmp10]
  libgmp-dev: [gmp:libgmp10, gmp:libgmpxx4ldbl]
  libgmp3-dev: [gmp:libgmp-dev]
lockfile_deps:
  libgmp10: [libgcc-s1]
  libgmpxx4ldbl: [libgcc-s1, libstdc++6]
  libgmp-dev: [libgcc-s1, libstdc++6, linux-libc-dev, rpcsvc-proto]
  libgmp3-dev: [libgcc-s1, libstdc++6, linux-libc-dev, rpcsvc-proto]
