name: build

on: [push, pull_request]

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out glbx
        uses: actions/checkout@v7

      # Required for rootless Podman and nested user namespaces.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build devcontainer
        run: podman build -t glbx-dev .devcontainer

      - name: Build
        run: >
          podman run --rm
          --tmpfs /tmp
          --security-opt 'unmask=/proc/*'
          --security-opt seccomp=unconfined
          --security-opt label=disable
          --security-opt apparmor=unconfined
          --userns keep-id:uid=1000,gid=1000
          -v "$GITHUB_WORKSPACE:/home/dev/workspace"
          -w /home/dev/workspace
          glbx-dev make build

      - name: Test
        run: >
          podman run --rm
          --tmpfs /tmp
          --security-opt 'unmask=/proc/*'
          --security-opt seccomp=unconfined
          --security-opt label=disable
          --security-opt apparmor=unconfined
          --userns keep-id:uid=1000,gid=1000
          -v "$GITHUB_WORKSPACE:/home/dev/workspace"
          -w /home/dev/workspace
          glbx-dev make test

      - name: End-to-end tests
        run: >
          podman run --rm
          --tmpfs /tmp
          --security-opt 'unmask=/proc/*'
          --security-opt seccomp=unconfined
          --security-opt label=disable
          --security-opt apparmor=unconfined
          --userns keep-id:uid=1000,gid=1000
          -v "$GITHUB_WORKSPACE:/home/dev/workspace"
          -w /home/dev/workspace
          glbx-dev make e2e

      - name: Cross-compile
        run: >
          podman run --rm
          --tmpfs /tmp
          --security-opt 'unmask=/proc/*'
          --security-opt seccomp=unconfined
          --security-opt label=disable
          --security-opt apparmor=unconfined
          --userns keep-id:uid=1000,gid=1000
          -v "$GITHUB_WORKSPACE:/home/dev/workspace"
          -w /home/dev/workspace
          glbx-dev make cross

      - name: Build documentation
        run: >
          podman run --rm
          --tmpfs /tmp
          --security-opt 'unmask=/proc/*'
          --security-opt seccomp=unconfined
          --security-opt label=disable
          --security-opt apparmor=unconfined
          --userns keep-id:uid=1000,gid=1000
          -v "$GITHUB_WORKSPACE:/home/dev/workspace"
          -w /home/dev/workspace
          glbx-dev make doc

      - name: Build OCI images
        run: >
          podman build
          --format oci
          --platform linux/amd64,linux/arm64
          --manifest glbx
          .

      - name: Publish OCI index to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          podman login -u token -p ${{ github.token }} ghcr.io
          podman manifest push --all --format oci glbx ghcr.io/${{ github.repository }}:latest

      - name: Upload the book as a Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./doc/book

      - name: Deploy to GitHub Pages
        id: deploy
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/deploy-pages@v5
